[package]
name = "solana-genesis"
description = "Blockchain, Rebuilt for Scale"
documentation = "https://docs.rs/solana-genesis"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "solana_genesis"

[[bin]]
name = "solana-genesis"
path = "src/main.rs"

[dependencies]
agave-feature-set = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
solana-account = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-accounts-db = { workspace = true }
solana-clap-utils = { workspace = true }
solana-cli-config = { workspace = true }
solana-clock = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-cluster-type = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-commitment-config = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-entry = { workspace = true }
solana-epoch-schedule = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-feature-gate-interface = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-fee-calculator = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-genesis-config = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-inflation = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-keypair = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-ledger = { workspace = true }
solana-loader-v3-interface = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-logger = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-native-token = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-poh-config = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-pubkey = { default-features = false , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-rent = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-runtime = { workspace = true }
solana-sdk-ids = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-signer = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-stake-interface = { version = "=2.0.0", features = ["borsh"] }
solana-stake-program = { workspace = true }
solana-time-utils = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-version = { workspace = true }
solana-vote-program = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
solana-borsh = { workspace = true }
solana-pubkey = { workspace = true, features = ["rand"] }
solana-runtime = { workspace = true, features = ["dev-context-only-utils"] }
