[package]
name = "solana-cli"
description = "Blockchain, Rebuilt for Scale"
documentation = "https://docs.rs/solana-cli"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "solana"
path = "src/main.rs"

[dependencies]
agave-feature-set = { workspace = true }
agave-syscalls = { workspace = true }
bincode = { workspace = true }
bs58 = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
const_format = { workspace = true }
criterion-stats = { workspace = true }
crossbeam-channel = { workspace = true }
ctrlc = { workspace = true, features = ["termination"] }
hex = { workspace = true }
humantime = { workspace = true }
log = { workspace = true }
num-traits = { workspace = true }
pretty-hex = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls", "json"] }
semver = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
solana-account = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-account-decoder = { workspace = true }
solana-address-lookup-table-interface = { workspace = true }
solana-borsh = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-clap-utils = { workspace = true }
solana-cli-config = { workspace = true }
solana-cli-output = { workspace = true }
solana-client = { workspace = true }
solana-clock = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-cluster-type = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-commitment-config = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-compute-budget-interface = { features = ["borsh"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-config-interface = "=2.0.0"
solana-connection-cache = { workspace = true }
solana-epoch-schedule = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-feature-gate-interface = { features = ["bincode"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-fee-calculator = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-fee-structure = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-hash = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-instruction = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-keypair = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-loader-v3-interface = { features = ["bincode"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-loader-v4-interface = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-loader-v4-program = { workspace = true }
solana-logger = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-message = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-native-token = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-nonce = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-offchain-message = { features = ["verify"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-packet = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-program-runtime = { workspace = true }
solana-pubkey = { default-features = false , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-pubsub-client = { workspace = true }
solana-quic-client = { workspace = true }
solana-remote-wallet = { workspace = true, features = ["default"] }
solana-rent = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-rpc-client = { workspace = true, features = ["default"] }
solana-rpc-client-api = { workspace = true }
solana-rpc-client-nonce-utils = { workspace = true, features = ["clap"] }
solana-sbpf = { workspace = true }
solana-sdk-ids = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-signature = { default-features = false , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-signer = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-slot-history = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-stake-interface = "=2.0.0"
solana-streamer = { workspace = true }
solana-system-interface = { features = ["bincode"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-sysvar = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-tps-client = { workspace = true }
solana-tpu-client = { workspace = true, features = ["default"] }
solana-transaction = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-transaction-error = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-transaction-status = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
solana-udp-client = { workspace = true }
solana-version = { workspace = true }
solana-vote-program = { workspace = true }
spl-memo-interface = { version = "=2.0.0" }
thiserror = { workspace = true }
tiny-bip39 = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
solana-faucet = { workspace = true }
solana-nonce-account = { workspace = true }
solana-presigner = { workspace = true }
solana-rpc = { workspace = true }
solana-sha256-hasher = { workspace = true }
solana-streamer = { workspace = true }
solana-test-validator = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
