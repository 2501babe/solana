[package]
name = "solana-faucet"
description = "Solana Faucet"
documentation = "https://docs.rs/solana-faucet"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
crate-type = ["lib"]
name = "solana_faucet"

[[bin]]
name = "solana-faucet"
path = "src/bin/faucet.rs"

[dependencies]
bincode = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
solana-clap-utils = { workspace = true }
solana-cli-config = { workspace = true }
solana-cli-output = { workspace = true }
solana-hash = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-instruction = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-keypair = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-logger = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-message = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-metrics = { workspace = true }
solana-packet = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-pubkey = { features = ["rand"] , git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-signer = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-system-interface = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-system-transaction = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-transaction = { git = "https://github.com/2501babe/solana-sdk.git", branch = "voteop" }
solana-version = { workspace = true }
spl-memo-interface = { version = "=2.0.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
